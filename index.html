<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator de Palavras-Chave</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Extrator de Palavras-Chave</h1>
        <p class="descricao">Cole seu texto abaixo para contar a frequência e extrair as palavras mais relevantes.</p>

        <textarea id="entrada-de-texto" rows="6" placeholder="Digite ou cole o seu texto aqui..."></textarea>
        
        <button id="botao-palavrachave">Extrair Palavras-Chave</button>

        <div id="resultado-palavrachave" class="resultado"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
